<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Surpresa ❤️</title>
<style>
body{
    text-align:center;
    font-family:Arial;
    background:#111;
    color:white;
}
img{
    width:300px;
    margin:20px;
}
</style>
</head>

<body>

<h1>Uma surpresa está acontecendo ❤️</h1>

<p id="contador"></p>

<div id="dia2" style="display:none;">
<h2>Nossa primeira foto</h2>
<img src="foto1.jpg">
</div>

<div id="dia3" style="display:none;">
<h2>Uma lembrança especial</h2>
<p>Desde que te conheci tudo mudou.</p>
</div>

<script>

const inicio = new Date("2026-03-07");
const hoje = new Date();

const diff = Math.floor((hoje - inicio) / (1000*60*60*24)) + 1;

document.getElementById("contador").innerText =
"Dia " + diff + " da surpresa";

if(diff >= 2){
 document.getElementById("dia2").style.display="block";
}

if(diff >= 3){
 document.getElementById("dia3").style.display="block";
}

</script>

</body>
</html>
