<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Uma pergunta...</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-family:Arial;
text-align:center;
color:white;
overflow:hidden;
transition:background 4s;
}

/* fundo */

.day1{background:linear-gradient(#ff9966,#ffcc66);}
.day2{background:linear-gradient(#ff9966,#ffcc66);}
.day3{background:linear-gradient(#6b7fd7,#3a3f87);}
.day4{background:linear-gradient(#1c1f3a,#000);}
.day5{background:linear-gradient(#000010,#000);}
.day6{background:linear-gradient(#ffd89b,#19547b);}

/* texto */

#text{
line-height:1.6;
font-size:22px;
max-width:90%;
min-height:120px;
padding:10px;
white-space:pre-line;
}

/* cronometro */

#timer{
margin-top:15px;
font-size:16px;
opacity:0.9;
}

/* estrelas */

.star{
position:fixed;
width:3px;
height:3px;
background:white;
border-radius:50%;
animation:blink 2s infinite alternate;
}

@keyframes blink{
0%{opacity:0.3}
100%{opacity:1}
}

/* lua */

.moon{
position:fixed;
top:80px;
right:50px;
width:60px;
height:60px;
background:white;
border-radius:50%;
box-shadow:0 0 20px white;
}

/* botões */

.buttons{
margin-top:40px;
display:none;
gap:25px;
flex-wrap:wrap;
justify-content:center;
}

button{
font-size:22px;
padding:12px 30px;
border:none;
border-radius:12px;
cursor:pointer;
}

#yes{
background:#ff4d6d;
color:white;
}

#no{
background:#444;
color:white;
position:absolute;
}

/* corações */

.heart{
position:fixed;
font-size:26px;
color:red;
animation:float 3s linear forwards;
}

@keyframes float{

0%{
transform:translateY(0);
opacity:1;
}

100%{
transform:translateY(-300px);
opacity:0;
}

}

</style>
</head>

<body>

<div id="text"></div>

<div id="timer"></div>

<div class="buttons">
<button id="yes">SIM</button>
<button id="no">NÃO</button>
</div>

<script>

/* MENSAGENS */

const messages = [

"Oi... eu queria te falar uma coisa.",

"engraçado como algumas pessoas entram na nossa vida sem fazer muito barulho e quando a gente percebe já mudaram tudo.  \neu não sei exatamente em qual momento isso aconteceu mas em algum ponto você se tornou uma das partes mais importantes do meu dia. \n\namanhã eu conto mais.",

"tem um momento estranho que acontece quando alguém começa a se tornar importante pra gente você começa a perceber que aquela pessoa aparece em pensamentos aleatórios do dia numa música numa piada num lugar e quando percebe ela já faz parte da sua rotina mesmo quando não está por perto em algum momento isso começou a acontecer comigo e era sempre você.\n\n amanhã eu te conto uma das coisas que mais gosto em você.",

"ontem eu disse que iria te contar algumas coisas que eu gosto em você. mas vamos ser honestos… você realmente achou que seria só uma?\n algumas das POUCAS coisas que eu gosto em você: \n seu sorriso\n\nseu olhar\n\nseu jeito de falar\n\nsua risada\n\nsua voz\n\nseu carinho\n\nsua gentileza\n\nsua atenção\n\nseu jeito único\n\nsua inteligência\n\nsua sensibilidade\n\nsua sinceridade\n\nsua presença\n\nsua calma\n\nsua energia\n\nseu humor\n\nseu jeito de enxergar o mundo\n\nsua forma de cuidar das pessoas\n\nseu jeito de me ouvir\n\na forma como você se importa\n\nseu abraço\n\nseu jeito de andar\n\nsua autenticidade\n\nsua simplicidade\n\nsua beleza\n\nsua delicadeza\n\nsua paciência\n\nseu olhar atento\n\nseu jeito de rir das coisas\n\nsua forma de conversar\n\nsua empatia\n\nseu jeito de surpreender\n\nsua criatividade\n\nsua forma de demonstrar carinho\n\nsua espontaneidade\n\nsua sinceridade no olhar\n\nseu jeito de ser leve\n\nsua forma de tornar momentos simples especiais\n\nseu brilho\n\nsua companhia\n\nseu bom coração\n\nsua forma de me entender\n\nsua maturidade\n\nseu jeito doce\n\nsua forma de animar o ambiente\n\nsua elegância\n\nsua humildade\n\nseu jeito de pensar\n\nsua forma de ver o lado bom das coisas\n\nseu jeito de demonstrar afeto\n\nsua forma de fazer o tempo passar rápido\n\nsua forma de tornar tudo mais interessante\n\nseu jeito de cuidar\n\nsua forma de escutar\n\nseu jeito de se expressar\n\nsua forma de demonstrar atenção\n\nsua presença tranquila\n\nseu olhar sincero\n\nsua forma de se preocupar\n\nsua forma de dar valor às coisas\n\nseu jeito verdadeiro\n\nsua forma de enxergar detalhes\n\nseu jeito de alegrar o dia\n\nsua forma de tratar as pessoas\n\nsua maneira de se importar\n\nsua forma de demonstrar consideração\n\nsua forma de fazer tudo parecer mais leve\n\nseu jeito de estar presente\n\nsua forma de demonstrar cuidado\n\nseu jeito de prestar atenção nos detalhes\n\nsua forma de valorizar momentos\n\nsua forma de enxergar beleza nas coisas simples\n\nseu jeito de demonstrar carinho nas pequenas coisas\n\nsua forma de transformar um dia comum em algo especial\n\nsua forma de fazer companhia\n\nseu sorriso… de novo\n\n e mesmo depois de tudo isso\nainda parece que faltam coisas pra dizer.\n\nmas talvez não precise dizer tudo hoje.\n\nafinal…\namanhã é o último dia.",

"obrigado por fazer parte desses dias. quem sabe a gente se vê por ai. por aqui, acabou... eu acho.",

"você é bem curiosa ein? eu disse que tinha acabado. ja que você tá tão interessada assim quero ver o quanto você tá disposta a chegar no final dessa historia vamos pra praia, quero ver o nascer do sol com você."

]

/* DATA */

let today = 6

let day

if(today <= 1) day = 1
else if(today == 2) day = 2
else if(today == 3) day = 3
else if(today == 4) day = 4
else if(today == 5) day = 5
else day = 6

document.body.className="day"+day

/* estrelas */

if(day>=4){

for(let i=0;i<60;i++){

let star=document.createElement("div")

star.className="star"

star.style.left=Math.random()*100+"vw"
star.style.top=Math.random()*100+"vh"

document.body.appendChild(star)

}

}

/* lua */

if(day>=4){

let moon=document.createElement("div")

moon.className="moon"

document.body.appendChild(moon)

}

/* DIGITAÇÃO */

const text=document.getElementById("text")

function typeWriter(msg,i=0,callback){

if(i < msg.length){

text.innerHTML += msg.charAt(i)

setTimeout(()=>typeWriter(msg,i+1,callback),40)

}else{

if(callback) callback()

}

}

/* MOSTRAR TEXTO */

if(day < 6){

typeWriter(messages[day-1])

}else{

typeWriter(messages.join("\n\n"),0,()=>{

document.querySelector(".buttons").style.display="flex"

})

}

/* CRONOMETRO */

const timer=document.getElementById("timer")

if(day < 6){

function updateTimer(){

let now=new Date()

let tomorrow=new Date()

tomorrow.setHours(24,0,0,0)

let diff=tomorrow-now

let h=Math.floor(diff/1000/60/60)
let m=Math.floor(diff/1000/60)%60
let s=Math.floor(diff/1000)%60

timer.innerHTML="Próxima mensagem em: "+h+"h "+m+"m "+s+"s"

}

setInterval(updateTimer,1000)

updateTimer()

}

/* BOTÃO NÃO */

const no=document.getElementById("no")

function moveNo(){

let x=Math.random()*(window.innerWidth-80)
let y=Math.random()*(window.innerHeight-60)

no.style.left=x+"px"
no.style.top=y+"px"

}

no.addEventListener("mouseover",moveNo)
no.addEventListener("touchstart",moveNo)

/* BOTÃO SIM */

const yes=document.getElementById("yes")

yes.addEventListener("click",()=>{

for(let i=0;i<30;i++){

let heart=document.createElement("div")

heart.className="heart"

heart.innerHTML="❤"

heart.style.left=Math.random()*window.innerWidth+"px"
heart.style.top=Math.random()*window.innerHeight+"px"

document.body.appendChild(heart)

setTimeout(()=>heart.remove(),3000)

}

})

</script>

</body>
</html>
