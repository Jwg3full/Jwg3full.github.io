<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checklist de Prevenção à PAV</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f4;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .checklist {
      list-style: none;
      padding: 0;
    }
    .checklist li {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .progress-bar {
      width: 100%;
      height: 25px;
      background-color: #ddd;
      border-radius: 5px;
      margin-top: 20px;
    }
    .progress {
      height: 100%;
      background-color: #2ecc71;
      width: 0%;
      border-radius: 5px;
      transition: width 0.3s ease-in-out;
    }
    .alert {
      margin-top: 15px;
      font-weight: bold;
      color: #e74c3c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Checklist de Prevenção à PAV</h1>
    <ul class="checklist">
      <li><label><input type="checkbox" onchange="updateProgress()" /> Elevação da cabeceira (30-45°)</label></li>
      <li><label><input type="checkbox" onchange="updateProgress()" /> Cuidados orais (a cada 6 horas)</label></li>
      <li><label><input type="checkbox" onchange="updateProgress()" /> Pressão do balonete e sedação descontinuada</label></li>
      <li><label><input type="checkbox" onchange="updateProgress()" /> Ventilação mecânica adequada</label></li>
      <li><label><input type="checkbox" onchange="updateProgress()" /> Troca correta do filtro bacteriano</label></li>
      <li><label><input type="checkbox" onchange="updateProgress()" /> Uso de EPIs e técnica antisséptica</label></li>
      <li><label><input type="checkbox" onchange="updateProgress()" /> Aspiração subglótica</label></li>
      <li><label><input type="checkbox" onchange="updateProgress()" /> Higiene das mãos</label></li>
    </ul>
    <div class="progress-bar">
      <div class="progress" id="progress"></div>
    </div>
    <div class="alert" id="alert"></div>
  </div>

  <script>
    function updateProgress() {
      const checkboxes = document.querySelectorAll('input[type="checkbox"]');
      const total = checkboxes.length;
      const checked = Array.from(checkboxes).filter(c => c.checked).length;
      const percent = Math.round((checked / total) * 100);
      
      document.getElementById("progress").style.width = percent + "%";
      
      const alertBox = document.getElementById("alert");
      if (percent < 99) {
        alertBox.textContent = `Conformidade: ${percent}%. ⚠️ Risco Moderado/Alto para PAV.`;
        alertBox.style.color = '#e67e22';
      } else {
        alertBox.textContent = `Conformidade: ${percent}%. ✅ Prevenção adequada.`;
        alertBox.style.color = '#27ae60';
      }
    }
  </script>
</body>
</html>
